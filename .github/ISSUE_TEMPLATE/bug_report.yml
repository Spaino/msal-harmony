name: Bug report
description: Report an integration or runtime problem with the community HAR.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include access tokens, refresh tokens, authorization codes, raw claims, client secrets, or personal data.
  - type: input
    id: sdk-version
    attributes:
      label: SDK / HAR version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: checksum
    attributes:
      label: HAR SHA-256
      placeholder: "output of shasum -a 256 msal-harmony-0.1.0.har"
  - type: input
    id: harmony
    attributes:
      label: HarmonyOS / OpenHarmony version
      placeholder: "HarmonyOS 6.0.0 / API 26"
    validations:
      required: true
  - type: input
    id: deveco
    attributes:
      label: DevEco Studio / SDK
      placeholder: "DevEco Studio 26.0.0, SDK 20"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a minimal host integration and the exact flow.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      description: Remove tokens, codes, claims and personal data before pasting.
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: I have removed all secrets and personal data from this report.
          required: true
